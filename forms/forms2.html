<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student registration form</title>
  </head>
  <body>
    <h1 style="text-align: center">Student Registration Form</h1>
    <form action="#" method="get">
      <label for="roll">Roll no.:</label>
      <input type="number" name="roll" id="roll" /> <br />
      <label for="name">Student name and last name:</label>
      <input type="text" name="name" id="name" /> <br />
      <label for="name1">Father's name:</label>
      <input type="text" name="name1" id="name1" /> <br />
      <label for="date">Date of birth:</label>
      <input type="date" name="date" id="date" /> <br />
      <label for="tel">Mobile no.:</label>
      <input type="tel" name="tel" id="tel" /> <br />
      <label for="mail">Email id:</label>
      <input type="email" name="mail" id="mail" /> <br />
      <label for="pass">Password:</label>
      <input type="password" name="pass" id="pass" /> <br />
      <p>Gender:</p>
      <input type="radio" name="gender" id="Male" />
      <label for="Male">Male</label> <br />
      <input type="radio" name="gender" id="Female" />
      <label for="Female">Female</label> <br />
      <p>Department:</p>
      <input type="checkbox" name="dep1" id="CSE" />
      <label for="CSE">CSE</label> <br />
      <input type="checkbox" name="dep2" id="IT" />
      <label for="IT">IT</label> <br />
      <input type="checkbox" name="dep3" id=" ECE" />
      <label for="ECE">ECE</label> <br />
      <input type="checkbox" name="dep4" id="Civil" />
      <label for="Civil">Civil</label> <br />
      <input type="checkbox" name="dep5" id="Mech" />
      <label for="Mech">Mech</label> <br />
      <label for="course">Course:</label>
      <select name="course" id="course">
        <option value="Law">Law</option>
        <option value="IT">IT</option>
        <option value="Teacher">Teacher</option>
      </select>
    </form>
    <label for="file">Student photo:</label>
    <input type="file" name="file" id="file" /> <br />
    <label for="city">City:</label>
    <input type="text" name="city" id="city" /> <br />
    <label for="adress"></label>
    <textarea name="adress" id="adress" rows="4" cols="50">adress</textarea>
    <br />
    <input type="submit" value="Submit" />
  </body>
</html>
